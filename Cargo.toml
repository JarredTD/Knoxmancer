[package]
name = "knoxmancer"
version = "1.3.0"
edition = "2024"
rust-version = "1.97"
description = "Project Zomboid mod development CLI"
license = "AGPL-3.0-only"
repository = "https://github.com/JarredTD/Knoxmancer"
readme = "README.md"
publish = false

[[bin]]
name = "knoxmancer"
path = "src/main.rs"

[[bin]]
name = "km"
path = "src/bin/km.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1"
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3.20"
