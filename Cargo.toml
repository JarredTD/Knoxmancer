[package]
name = "knoxmancer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Project Zomboid mod development CLI"
license = "AGPL-3.0"

[[bin]]
name = "knoxmancer"
path = "src/main.rs"

[[bin]]
name = "km"
path = "src/bin/km.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"
