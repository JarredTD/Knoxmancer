[package]
name = "knoxmancer"
version = "0.3.1"
edition = "2024"
rust-version = "1.97"
description = "Project Zomboid mod development CLI"
license = "AGPL-3.0"
repository = "https://github.com/JarredTD/Knoxmancer"
readme = "README.md"
publish = false

[[bin]]
name = "knoxmancer"
path = "src/main.rs"

[[bin]]
name = "km"
path = "src/bin/km.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"
